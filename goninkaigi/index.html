<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5人のなんでも会議</title>
<meta name="description" content="お題を入れると、AIキャラ5人が本気で会議します。iPhone・Androidで配信中。">
<meta property="og:title" content="5人のなんでも会議">
<meta property="og:description" content="お題を入れると、AIキャラ5人が本気で会議します。">
<meta property="og:image" content="https://feathecrea.com/goninkaigi/icon.png">
<meta property="og:url" content="https://feathecrea.com/goninkaigi/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f6f5fb;
    --card: #ffffff;
    --ink: #1e2433;
    --sub: #5a6072;
    --navy: #1f2a44;
    --green: #1ca726;
    --line: #e6e4ef;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 28px;
    padding: 36px 24px 28px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(40, 40, 80, 0.10);
  }
  .icon {
    width: 132px;
    height: 132px;
    border-radius: 30px;
    box-shadow: 0 10px 28px rgba(28, 167, 38, 0.28);
  }
  h1 {
    font-size: 26px;
    margin: 20px 0 8px;
    letter-spacing: 0.02em;
  }
  .lead {
    color: var(--sub);
    font-size: 15px;
    line-height: 1.7;
    margin: 0 0 26px;
  }
  .stores { display: grid; gap: 12px; }
  .store {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 18px;
    border-radius: 16px;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    border: 1.5px solid var(--line);
    color: var(--ink);
    background: #fff;
    transition: transform .08s ease;
  }
  .store:active { transform: scale(0.98); }
  .store.primary {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
  }
  .store svg { width: 22px; height: 22px; flex: none; }
  .note {
    margin-top: 22px;
    color: #8a8fa0;
    font-size: 12px;
    line-height: 1.6;
  }
  .links {
    margin: 10px 0 0;
    font-size: 12px;
    line-height: 1.9;
    color: #b0b4c2;
  }
  .links a { color: #8a8fa0; text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .lang {
    margin-top: 16px;
    font-size: 13px;
  }
  .lang button {
    background: none;
    border: none;
    color: var(--sub);
    font: inherit;
    cursor: pointer;
    padding: 4px 6px;
  }
  .lang button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
  <main class="card">
    <img class="icon" src="icon.png" alt="" width="132" height="132">
    <h1 data-i18n="name">5人のなんでも会議</h1>
    <p class="lead" data-i18n="lead">お題を入れると、AIキャラ5人が<br>本気で会議します。</p>

    <div class="stores">
      <a class="store" id="ios" href="https://apps.apple.com/app/id6790642356" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.6c-.02-2.22 1.81-3.29 1.9-3.34-1.04-1.52-2.65-1.72-3.22-1.75-1.37-.14-2.68.81-3.37.81-.7 0-1.77-.79-2.91-.77-1.5.02-2.88.87-3.65 2.21-1.56 2.7-.4 6.7 1.12 8.89.74 1.07 1.62 2.28 2.78 2.23 1.12-.04 1.54-.72 2.89-.72s1.73.72 2.91.7c1.2-.02 1.96-1.09 2.69-2.17.85-1.24 1.2-2.45 1.22-2.51-.03-.01-2.34-.9-2.36-3.58zM14.15 6.07c.61-.75 1.03-1.78.92-2.82-.89.04-1.97.6-2.6 1.34-.57.66-1.07 1.72-.94 2.73.99.08 2-.5 2.62-1.25z"/></svg>
        <span data-i18n="ios">App Store でダウンロード</span>
      </a>
      <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.feathecrea.goninkaigi" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.1 2.6c-.2.22-.33.56-.33 1v16.8c0 .44.13.78.34 1l.05.05 9.4-9.4v-.1l-9.4-9.4-.06.05zM16.7 15.2l-3.14-3.14v-.12l3.14-3.14.07.04 3.72 2.11c1.06.6 1.06 1.59 0 2.2l-3.72 2.1-.07.05zM16.77 15.16 13.56 12l-9.46 9.45c.35.37.93.42 1.58.05l11.09-6.34M16.77 8.84 5.68 2.5c-.65-.37-1.23-.32-1.58.05L13.56 12l3.21-3.16z"/></svg>
        <span data-i18n="android">Google Play で手に入れよう</span>
      </a>
    </div>

    <p class="note" data-i18n="note">会議はフィクションのエンターテインメントです。</p>
    <p class="links">
      <a href="support.html" data-i18n="support">サポート</a> ·
      <a href="privacy.html" data-i18n="privacy">プライバシー</a> ·
      <a href="terms.html" data-i18n="terms">利用規約</a> ·
      <a href="tokushoho.html" data-i18n="tokushoho">特商法表記</a>
    </p>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ja" aria-pressed="true">日本語</button> ·
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </main>

<script>
  // Store-specific campaign tags so each source can be measured separately.
  // Use ?src=threads / ?src=tiktok / ?src=instagram / ?src=youtube on the profile link.
  var src = (new URLSearchParams(location.search).get("src") || "link").replace(/[^a-z0-9_-]/gi, "");
  document.getElementById("android").href =
    "https://play.google.com/store/apps/details?id=com.feathecrea.goninkaigi&referrer=" +
    encodeURIComponent("utm_source=" + src + "&utm_medium=social&utm_campaign=profile");
  document.getElementById("ios").href =
    "https://apps.apple.com/app/id6790642356?ct=" + encodeURIComponent(src);

  // Put the visitor's own store first and highlight it.
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && "ontouchend" in document);
  var ios = document.getElementById("ios"), android = document.getElementById("android");
  if (isAndroid) { android.classList.add("primary"); android.parentNode.insertBefore(android, ios); }
  else { ios.classList.add("primary"); }

  var T = {
    ja: { name: "5人のなんでも会議", lead: "お題を入れると、AIキャラ5人が<br>本気で会議します。",
          ios: "App Store でダウンロード", android: "Google Play で手に入れよう",
          note: "会議はフィクションのエンターテインメントです。",
          support: "サポート", privacy: "プライバシー", terms: "利用規約", tokushoho: "特商法表記" },
    en: { name: "Five Minds, One Topic", lead: "Give it any topic, and five AI characters<br>hold a serious debate.",
          ios: "Download on the App Store", android: "Get it on Google Play",
          note: "All meetings are fictional entertainment.",
          support: "Support", privacy: "Privacy", terms: "Terms", tokushoho: "Legal notice (Japan)" }
  };
  function setLang(l) {
    document.documentElement.lang = l;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.innerHTML = T[l][el.getAttribute("data-i18n")];
    });
    document.title = T[l].name;
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === l));
    });
  }
  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
  });
  var q = new URLSearchParams(location.search).get("lang");
  setLang(q === "en" || q === "ja" ? q : ((navigator.language || "ja").toLowerCase().indexOf("ja") === 0 ? "ja" : "en"));
</script>
</body>
</html>
